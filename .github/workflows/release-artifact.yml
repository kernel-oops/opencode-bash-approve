name: Linux x86-64 artefact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install exact Go toolchain from go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: hooks/bash-approve/go.mod
          cache-dependency-path: hooks/bash-approve/go.sum

      - name: Verify toolchain and source version
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          required_go="go$(awk '$1 == "go" { print $2; exit }' hooks/bash-approve/go.mod)"
          actual_go="$(go env GOVERSION)"
          test "$actual_go" = "$required_go"

          version="$(tr -d '\r\n' < VERSION)"
          test -n "$version"
          case "$version" in
            *[!0-9A-Za-z.+-]*) echo "VERSION contains unsafe characters" >&2; exit 1 ;;
          esac
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "v${version}"
          fi

          commit="$(git rev-parse HEAD)"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          build_date="$(date -u -d "@${source_date_epoch}" '+%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "source_date_epoch=$source_date_epoch"
            echo "build_date=$build_date"
            echo "go_version=$actual_go"
          } >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: hooks/bash-approve
        run: |
          go test ./...
          go test -race ./...
          go vet ./...

      - name: Build deterministic Linux x86-64 binary
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          BUILD_DATE: ${{ steps.identity.outputs.build_date }}
        working-directory: hooks/bash-approve
        run: |
          set -euo pipefail
          mkdir -p ../../dist/package
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -buildid= -X main.buildVersion=${VERSION} -X main.buildCommit=${COMMIT} -X main.buildDate=${BUILD_DATE}" \
            -o ../../dist/package/approve-bash .

      - name: Assemble metadata and checksums
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          BUILD_DATE: ${{ steps.identity.outputs.build_date }}
          GO_VERSION: ${{ steps.identity.outputs.go_version }}
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          package=dist/package
          cp hooks/bash-approve/categories.yaml LICENSE NOTICE PROVENANCE.md "$package/"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = {
              "name": "approve-bash",
              "version": os.environ["VERSION"],
              "commit": os.environ["COMMIT"],
              "build_date": os.environ["BUILD_DATE"],
              "source_date_epoch": int(os.environ["SOURCE_DATE_EPOCH"]),
              "go_version": os.environ["GO_VERSION"],
              "target": "linux/amd64",
              "cgo_enabled": False,
              "build_flags": ["-trimpath", "-buildvcs=false", "-ldflags=-s -w -buildid= -X main.buildVersion=... -X main.buildCommit=... -X main.buildDate=..."],
              "upstream_commit": "a81006c2950d23c3d2c81e1faecd695865728d53",
          }
          Path("dist/package/BUILD-INFO.json").write_text(
              json.dumps(data, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          "$package/approve-bash" --version-json > dist/version.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          actual = json.loads(Path("dist/version.json").read_text(encoding="utf-8"))
          assert actual["version"] == os.environ["VERSION"]
          assert actual["commit"] == os.environ["COMMIT"]
          assert actual["build_date"] == os.environ["BUILD_DATE"]
          assert actual["protocol"] == "opencode-bash-approve"
          assert actual["protocol_version"] == 1
          PY
          rm dist/version.json

          manifest=dist/SHA256SUMS
          (
            cd "$package"
            find . -type f -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum
          ) > "$manifest"
          mv "$manifest" "$package/SHA256SUMS"

      - name: Create reproducible archive
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          archive="approve-bash_${VERSION}_linux_amd64.tar.gz"
          tar \
            --sort=name \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner \
            --format=posix \
            --pax-option=delete=atime,delete=ctime \
            -C dist/package -cf - . \
            | gzip -n > "dist/${archive}"
          (cd dist && sha256sum "$archive" > "${archive}.sha256")

      - name: Upload artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approve-bash-${{ steps.identity.outputs.version }}-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
